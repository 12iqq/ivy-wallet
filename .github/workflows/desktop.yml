name: Desktop

# The Windows app in desktop/: runs its tests and builds the installer, which you can
# download from the run's page under Artifacts. Releases get theirs from release.yml.
on:
  push:
    branches:
      - main
    paths:
      - desktop/**
      # the report maths it shares with the phone app
      - feature/insights/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      # ScreenshotTest draws every page with made-up data. When run by hand, they go to a throwaway
      # branch so they can be looked at without downloading the build's files.
      - name: Save the screenshots
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir ../shots && cp build/screenshots/*.png ../shots/ && cd ../shots
          git init -q -b desktop-screenshots
          git config user.name "12iqq"
          git config user.email "71027322+12iqq@users.noreply.github.com"
          git add . && git commit -q -m "Desktop screenshots"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" desktop-screenshots

      - name: Build the installer
        run: ./gradlew packageMsi

      # installs it on this machine, checks the Start menu shortcuts, then uninstalls it with its own shortcut
      - name: Try the installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/test-install.ps1 build/compose/binaries/main/msi

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: IvyWalletUAE-desktop-installer
          path: desktop/build/compose/binaries/main/msi/*.msi
