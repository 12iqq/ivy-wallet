name: Desktop

# The Windows app on the desktop branch: runs its tests and builds the installer,
# which you can download from the run's page under Artifacts.
on:
  push:
    branches:
      - desktop
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      # ScreenshotTest draws every page with made-up data; printed here so they can be looked at
      # without downloading anything
      - name: Print the screenshots
        run: |
          for f in build/screenshots/Overview-light-small.jpg build/screenshots/Reports-light-small.jpg; do
            echo "BEGIN-SCREENSHOT $(basename "$f")"
            base64 -w 8000 "$f"
            echo "END-SCREENSHOT"
          done

      - name: Build the installer
        run: ./gradlew suggestRuntimeModules packageMsi

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: IvyWalletUAE-desktop-installer
          path: desktop/build/compose/binaries/main/msi/*.msi
