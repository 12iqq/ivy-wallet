name: Release

# Publishes a GitHub Release with the APK and the Windows installer whenever the
# app version changes. To ship a new version: bump `version-name` (and `version-code`)
# in gradle/libs.versions.toml and optionally add docs/release-notes/v<version>.md.
on:
  push:
    branches:
      - main
    paths:
      - gradle/libs.versions.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '18'

      - name: Gradle cache
        if: steps.version.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        if: steps.version.outputs.exists == 'false'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: release
        run: |
          # the private key from signing-key.yml, encrypted with the same password
          if [ -z "$SIGNING_STORE_PASSWORD" ] || [ ! -f release-key.jks.gpg ]; then
            echo "No signing key: add the RELEASE_KEY_PASSWORD secret and run the Create signing key workflow."
            exit 1
          fi
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output sign.jks release-key.jks.gpg <<< "$SIGNING_STORE_PASSWORD"
          ./gradlew :app:assembleRelease

      - name: Check the signature
        if: steps.version.outputs.exists == 'false'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          # signed with the private key, not the debug key
          grep -q "CN=Ivy Wallet UAE Edition" signature.txt

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK="IvyWalletUAE-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"

          NOTES="docs/release-notes/v$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            NOTES=release-notes.md
            PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || true)
            {
              echo "## Changes"
              if [ -n "$PREVIOUS" ]; then
                git log --pretty='- %s' "$PREVIOUS"..HEAD
              else
                git log --pretty='- %s' -20
              fi
            } > "$NOTES"
          fi

          gh release create "v$VERSION" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Ivy Wallet UAE v$VERSION" \
            --notes-file "$NOTES"

  # The Windows app goes into the same release. Run by hand, this also adds it to a
  # release that doesn't have it yet.
  windows:
    needs: release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.release.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4

      - name: Check the release
        id: check
        run: |
          MSI="IvyWalletUAE-Desktop-v$VERSION.msi"
          echo "msi=$MSI" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qxF "$MSI"; then
            echo "v$VERSION already has $MSI, nothing to do."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.check.outputs.missing == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        if: steps.check.outputs.missing == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build the installer
        if: steps.check.outputs.missing == 'true'
        working-directory: desktop
        run: ./gradlew packageMsi

      - name: Try the installer
        if: steps.check.outputs.missing == 'true'
        working-directory: desktop
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/test-install.ps1 build/compose/binaries/main/msi

      - name: Add it to the release
        if: steps.check.outputs.missing == 'true'
        run: |
          MSI="${{ steps.check.outputs.msi }}"
          cp desktop/build/compose/binaries/main/msi/*.msi "$MSI"
          gh release upload "v$VERSION" "$MSI"
          # the notes may have gained a part about the Windows app since the release was made
          NOTES="docs/release-notes/v$VERSION.md"
          if [ -f "$NOTES" ]; then
            gh release edit "v$VERSION" --notes-file "$NOTES"
          fi
