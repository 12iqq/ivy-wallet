name: Something isn't working
description: Tell me what went wrong in the app.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did the app do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the top of Settings, for example 1.1.0 (219).
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Samsung Galaxy A55, Android 15
  - type: markdown
    attributes:
      value: Screenshots help. Please hide account numbers and balances first.
